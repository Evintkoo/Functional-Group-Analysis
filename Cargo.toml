[package]
name = "functional_group_analysis"
version = "0.1.0"
edition = "2021"
description = "Graph-based functional group analysis of drug-like molecules using GNN and VGAE"

[dependencies]
burn = { version = "0.16", features = ["ndarray", "wgpu", "autodiff", "train"] }
burn-ndarray = "0.16"
burn-wgpu = "0.16"
petgraph = "0.7"
csv = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
rand_distr = "0.4"
ndarray = "0.16"
ndarray-rand = "0.15"
log = "0.4"
env_logger = "0.11"
rayon = "1.10"
plotters = "0.3"
plotters-svg = "0.3"
rag-umap = "0.0.0"

[[bin]]
name = "functional_group_analysis"
path = "src/main.rs"
